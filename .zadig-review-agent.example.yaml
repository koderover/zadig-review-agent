review:
  concurrency: 4
  context_lines: 3
  max_tool_rounds: 30
  max_context_tool_calls: 10
  context_convergence_ratio: 0.5
  max_chunk_tokens: 20000
  max_tokens_budget: 0
  confidence_threshold: 0.75
  fail_on:
    - critical
    - high

model:
  protocol: openai
  name: gpt-4o
  endpoint: https://api.openai.com/v1
  api_key: sk-...
  timeout: 8m

output:
  # Relative report paths are saved under:
  # ~/.zadig-review-agent/reports/<flattened-repository-path>/<review-id>/
  json: review-report.json
  markdown: review-report.md
  # Optional full normalized LLM request/response log. Markdown is human-readable;
  # use a .jsonl suffix for machine-readable output. This may contain source code.
  # debug: llm-debug.md
  console: detailed
  language: zh-CN
  # Print review phase and retry progress to stderr.
  progress: true
